name: rbviser
channels:
  - conda-forge
dependencies:
  - python>=3.9
  - pandas
  - numpy
  - scipy
  - pip
  - pip:
      # viser 0.2.x と 1.x では ViserUrdf のシーンノード命名規則が異なる。
      # 未固定だと既存環境が古いバージョンのまま取り残されるので固定する。
      - viser==1.1.0
      # URDFの順運動学を直接叩くため（viserの推移的依存に頼らず明示する）
      - yourdfpy
      - robot_descriptions
      - fastapi
      - uvicorn
